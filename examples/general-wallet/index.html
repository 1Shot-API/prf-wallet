<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OWS — Example General Wallet</title>
  <!-- branding shell + create-backup action -->
  <style>
    :root {
      color-scheme: light dark;
      font-family: system-ui, sans-serif;
      line-height: 1.5;
    }
    html,
    body {
      margin: 0;
      min-height: 100%;
      background: Canvas;
      color: CanvasText;
    }
    .wallet-shell {
      display: flex;
      flex-direction: column;
      min-height: 100%;
      background: Canvas;
    }
    .wallet-chrome {
      display: none;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
      padding: 0.625rem 0.75rem;
      border-bottom: 1px solid color-mix(in srgb, CanvasText 15%, transparent);
      background: Canvas;
      flex-shrink: 0;
    }
    .wallet-chrome--embedded {
      display: flex;
    }
    .wallet-chrome-title {
      margin: 0;
      font-size: 0.9rem;
      font-weight: 600;
    }
    .wallet-close {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 1.75rem;
      height: 1.75rem;
      padding: 0;
      border: 1px solid color-mix(in srgb, CanvasText 20%, transparent);
      border-radius: 6px;
      background: transparent;
      color: inherit;
      font: inherit;
      font-size: 1.125rem;
      line-height: 1;
      cursor: pointer;
    }
    .wallet-close:focus-visible {
      outline: 2px solid Highlight;
      outline-offset: 2px;
    }
    .wallet-body {
      flex: 1;
      padding: 1rem 1.25rem;
      background: Canvas;
    }
    h1 {
      margin: 0 0 0.25rem;
      font-size: 1.25rem;
    }
    .subtitle {
      margin: 0 0 1rem;
      opacity: 0.75;
      font-size: 0.9rem;
    }
    .status-panel {
      display: grid;
      gap: 0.5rem;
      max-width: 36rem;
    }
    .status-row {
      display: grid;
      grid-template-columns: 7rem 1fr;
      gap: 0.5rem;
      align-items: baseline;
    }
    .status-label {
      font-weight: 500;
    }
    .status-value {
      font-family: ui-monospace, monospace;
      font-size: 0.85rem;
      word-break: break-all;
    }
    .chain-select {
      width: 100%;
      max-width: 16rem;
      padding: 0.375rem 0.5rem;
      border: 1px solid color-mix(in srgb, CanvasText 25%, transparent);
      border-radius: 6px;
      background: Canvas;
      color: inherit;
      font: inherit;
      font-size: 0.9rem;
    }
    .chain-select:focus-visible {
      outline: 2px solid Highlight;
      outline-offset: 2px;
    }
    .wallet-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-top: 0.5rem;
    }
    .wallet-action {
      padding: 0.5rem 0.875rem;
      border: 1px solid color-mix(in srgb, CanvasText 25%, transparent);
      border-radius: 6px;
      background: transparent;
      color: inherit;
      font: inherit;
      font-size: 0.9rem;
      cursor: pointer;
    }
    .wallet-action:focus-visible {
      outline: 2px solid Highlight;
      outline-offset: 2px;
    }
    #signer-container {
      position: absolute;
      width: 0;
      height: 0;
      overflow: hidden;
      clip-path: inset(50%);
    }
  </style>
</head>
<body>
  <div class="wallet-shell">
    <header id="wallet-chrome" class="wallet-chrome" aria-label="Wallet panel">
      <h2 class="wallet-chrome-title">Open Wallet</h2>
      <button
        type="button"
        id="wallet-close"
        class="wallet-close"
        aria-label="Close wallet"
      >
        ×
      </button>
    </header>

    <div class="wallet-body">
      <h1>OWS Example General Wallet</h1>
      <p class="subtitle">Branding Layer — general-purpose wallet with nested Signing Layer.</p>

      <section class="status-panel" aria-label="Wallet status">
        <div class="status-row">
          <span class="status-label">Status</span>
          <span id="wallet-status" class="status-value">Loading…</span>
        </div>
        <div class="status-row">
          <span class="status-label">EVM</span>
          <span id="evm-address" class="status-value">—</span>
        </div>
        <div class="status-row">
          <span class="status-label">Solana</span>
          <span id="solana-address" class="status-value">—</span>
        </div>
        <div class="status-row">
          <label class="status-label" for="chain-select">Chain</label>
          <select
            id="chain-select"
            class="chain-select"
            aria-label="Active chain"
          >
            <option value="0xaa36a7">Sepolia</option>
            <option value="0x14a34">Base Sepolia</option>
            <option value="0x4cef52">Arc Testnet</option>
          </select>
        </div>
        <div class="status-row">
          <span class="status-label">Credentials</span>
          <span id="credential-count" class="status-value">—</span>
        </div>
        <div class="wallet-actions">
          <button type="button" id="create-backup" class="wallet-action">
            Create backup
          </button>
          <button
            type="button"
            id="restore-backup"
            class="wallet-action"
            hidden
          >
            Restore backup
          </button>
          <button type="button" id="list-credentials" class="wallet-action">
            My credentials
          </button>
        </div>
      </section>
    </div>
  </div>

  <div id="signer-container"></div>
</body>
</html>
